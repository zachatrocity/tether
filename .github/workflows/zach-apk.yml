name: Tether APK
on:
  push:
    branches: [fix/remote-mac-anisette, brand/tether]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure Android and stable fork signing
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          test -n "$DEBUG_KEYSTORE_BASE64"
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > app/debug-keystore.jks
          sudo apt-get update -qq
          sudo apt-get install -y pkg-config
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Python tests
        run: |
          pip install -r app/src/test/python/requirements.txt
          python -m pytest app/src/test/python -q
      - name: APK and JVM tests
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --console=plain
      - name: Login UI and native runtime tests
        run: >-
          ./gradlew :app:testEmulatorDebugAndroidTest --console=plain
          -Pandroid.testInstrumentationRunnerArguments.class=dev.wander.android.opentagviewer.AppleLoginFallbackFlowTest,dev.wander.android.opentagviewer.ui.RemoteServerButtonLayoutTest,dev.wander.android.opentagviewer.ui.TetherBrandingTest,dev.wander.android.opentagviewer.anisette.MacCoreAdiLoadTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: |
            app/build/reports/
            app/build/outputs/androidTest-results/
            app/build/outputs/managed_device_android_test_additional_output/
      - uses: actions/upload-artifact@v4
        with:
          name: Tether
          path: app/build/outputs/apk/debug/*.apk
